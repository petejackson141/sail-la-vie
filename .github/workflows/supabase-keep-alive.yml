# Supabase keep-alive  (06.11.2026)
# ----------------------------------------------------------------------
# Free-plan Supabase projects are paused after about 7 days with too
# little database activity. This job reads one row from the
# `keep_alive` table twice a week, so the project always has activity.
#
# Needs two repository secrets (GitHub > Settings > Secrets and
# variables > Actions):
#   SUPABASE_URL              https://lccwbkarqjohunofsghd.supabase.co
#   SUPABASE_PUBLISHABLE_KEY  the sb_publishable_... key in docs/js/auth.js
# (same project and key as the app - the live Frankfurt database)
#
# NOTE: GitHub only runs scheduled jobs from the DEFAULT branch (main),
# so this file goes live once you run 3-go-live.bat.
# ----------------------------------------------------------------------

name: Supabase keep-alive

on:
  schedule:
    # Mondays and Thursdays at 06:17 UTC (08:17 Israel winter time).
    # The longest gap is 4 days, well inside Supabase's 7-day window.
    - cron: "17 6 * * 1,4"
  # Adds a "Run workflow" button in the Actions tab for testing by hand.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read one row from keep_alive
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # --fail: an HTTP error (401, 404, 500...) makes the job fail,
          #         so GitHub emails you instead of failing silently.
          # --retry: try again if Supabase is briefly unreachable.
          response=$(curl --silent --show-error --fail \
            --retry 3 --retry-delay 10 --retry-all-errors \
            "$SUPABASE_URL/rest/v1/keep_alive?select=id,pinged_at&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY")

          echo "Supabase answered: $response"

          # An empty list "[]" means the table is there but has no row,
          # or the read permission is missing. Fail so you notice.
          if [ "$response" = "[]" ]; then
            echo "::error::keep_alive returned no rows. Check the table and its RLS policy."
            exit 1
          fi
